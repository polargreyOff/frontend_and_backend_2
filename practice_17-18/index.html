<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Notes Realtime PWA</title>
    <meta
      name="description"
      content="PWA-приложение для заметок с HTTPS, App Shell, WebSocket и push-уведомлениями."
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Focus Notes" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="shell-header">
        <div class="hero-copy">
          <h1>Focus Notes</h1>
        </div>

        <div class="status-panel">
          <div class="status-row">
            <span id="network-indicator" class="status-dot"></span>
            <span id="network-text">Проверяем соединение...</span>
          </div>
        </div>
      </header>

      <nav class="shell-nav" aria-label="Навигация приложения">
        <button class="nav-button active" data-page="home" type="button">Главная</button>
        <button class="nav-button" data-page="about" type="button">О приложении</button>
      </nav>

      <section class="shell-summary">
        <div>
          <h2 id="page-title">Главная</h2>
          <p id="page-subtitle" class="muted">
            Добавляй заметки, проверяй офлайн-режим, realtime-синхронизацию и push.
          </p>
        </div>
        <footer class="push-actions">
          <button id="enable-push" class="action-button success" type="button">
            Включить уведомления
          </button>
          <button id="disable-push" class="action-button danger" type="button" hidden>
            Отключить уведомления
          </button>
        </footer>
      </section>

      <main id="app-content" class="shell-content" aria-live="polite"></main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
